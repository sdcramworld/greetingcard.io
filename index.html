<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة التهنئة</title>
    <style>
        @font-face {
            font-family: 'NotoKufiArabic';
            src: url('NotoKufiArabic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            font-family: 'NotoKufiArabic', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            text-align: center;
            overflow: hidden;
            padding: 10px;
        }

        .container {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
            color: black;
        }

        .card-form input {
            margin-bottom: 10px;
            padding: 20px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
            color: black;
            direction: rtl;
        }

        .card-form button {
            all: unset;
            padding: 10px 20px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
        }

        .preview canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>بطاقة عيد الفطر</h1>
        <h1>Eid Al-Fitr Card</h1>

        <div class="preview" id="previewContainer">
            <canvas id="previewCanvas"></canvas>
        </div>

        <div class="card-form">
            <input type="text" id="nameInput" placeholder=" ادخل اسمك | Enter your Name " oninput="updatePreview()">
            <button onclick="generateCard()">Download Card | تحميل البطاقة</button>
        </div>
    </div>

    <script>
        let selectedDesign = "https://images.ctfassets.net/jrh3lrn7oql1/6J4gHRdUIsSBnTQrsGnkgm/ec5738188d97079d142fe816768e8378/Eid_Alfiter_cards.jpg";
        let canvas = document.getElementById("previewCanvas");
        let ctx = canvas.getContext("2d");
        let image = new Image();
        image.crossOrigin = "Anonymous";
        image.src = selectedDesign;

        image.onload = function () {
            canvas.width = image.width;
            canvas.height = image.height;
            document.fonts.ready.then(updatePreview);
        };

        function updatePreview() {
            if (!selectedDesign) return;

            let nameText = document.getElementById("nameInput").value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            let fontSize = 45; // Slightly larger font for better visibility
            ctx.font = `bold ${fontSize}px 'NotoKufiArabic'`;
            
            // 1. Set text color to White
            ctx.fillStyle = "#ffffff"; 
            
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";

            let textX = canvas.width / 2;
            
            // 2. Moved up significantly (120px from the bottom)
            // Increase this number to move it even higher
            let textY = canvas.height - 120; 
            
            // Optional: Adding a soft shadow to make white text pop on light backgrounds
            ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillText(nameText, textX, textY);
        }

        function generateCard() {
            if (canvas.width === 0 || canvas.height === 0) {
                alert("يرجى إنشاء المعاينة أولاً!");
                return;
            }

            let link = document.createElement("a");
            link.href = canvas.toDataURL("image/png", 1.0);
            link.download = "Custom_Card.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
