<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة التهنئة</title>
    <style>
        @font-face {
            font-family: 'NotoKufiArabic';
            src: url('NotoKufiArabic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            font-family: 'NotoKufiArabic', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            /* جعل الارتفاع ثابتاً لمنع السكرول */
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff; /* خلفية بيضاء بدون لون رمادي */
            text-align: center;
            overflow: hidden; /* منع السكرول نهائياً */
            padding: 10px;
        }

        .container {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
            color: black;
        }

       
        h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #333;
        }
        h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #333;
        }

        /* --- تنسيق معرض الصور --- */
        .design-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .design-option {
            width: 70px; /* حجم أصغر للخيارات لتوفير مساحة */
            height: 100px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            object-fit: cover;
        }

        .design-option.active {
            border-color: #7BDECA;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(123, 222, 202, 0.5);
        }

        /* --- تنسيق المعاينة --- */
        .preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .preview canvas {
            max-width: 100%;
            max-height: 50vh; /* تحديد ارتفاع اللوحة لكي لا تسبب سكرول */
            border-radius: 10px;
            border: 1px solid #eee;
            object-fit: contain;
        }

        /* --- تنسيق النماذج --- */
        .card-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-form input {
            margin-bottom: 10px;
            padding: 12px;
            width: auto;
            min-width: 150px;
            border-radius: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            text-align: center;
            direction: rtl;
        }

        .card-form button {
            padding: 10px 25px;
            background: #e0e0e0;
            color: #000000;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: auto;
            min-width: 150px;
            transition: all 0.3s ease;
        }

        .card-form button:hover {
            background: #a9a9a9;
            border-color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>بطاقة عيد الأضحى <br> Eid Al-Adha</h2>
        <h3>اختر التصميم | Select Design</h3>
        
        <div class="design-selector" id="designSelector">
            <img src="https://images.ctfassets.net/jrh3lrn7oql1/514XAQipKfC5tojDBSOssg/d36aca13ca3be5dd225def65f827a679/Eid_Al-Adha_2026_card_1.jpg" 
                 class="design-option active" 
                 onclick="selectDesign(this, this.src)">
            
            <img src="https://images.ctfassets.net/jrh3lrn7oql1/5KQJReyJA5jXUsIroa1VEb/461effb16220eaf1891f309dd7829aca/Eid_Al-Adha_2026_card_2.jpg" 
                 class="design-option" 
                 onclick="selectDesign(this, this.src)">
        </div>

        <div class="preview">
            <canvas id="previewCanvas"></canvas>
        </div>

        <div class="card-form">
            <input type="text" id="nameInput" placeholder="ادخل اسمك | Enter your Name" oninput="updatePreview()">
            <button onclick="generateCard()">تحميل البطاقة | Download</button>
        </div>
    </div>

    <script>
        let canvas = document.getElementById("previewCanvas");
        let ctx = canvas.getContext("2d");
        let image = new Image();
        image.crossOrigin = "Anonymous";

        function selectDesign(element, src) {
            document.querySelectorAll('.design-option').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
            image.src = src;
        }

        image.onload = function () {
            canvas.width = image.width;
            canvas.height = image.height;
            updatePreview();
        };

        function updatePreview() {
            let nameText = document.getElementById("nameInput").value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            let fontSize = 65; 
            ctx.font = `bold ${fontSize}px 'NotoKufiArabic'`;
            ctx.fillStyle = "#000000";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.shadowColor = "transparent"; // إزالة الظل ليكون التصميم أنظف
            ctx.fillText(nameText, canvas.width / 2, canvas.height - 180);
        }

        function generateCard() {
            let link = document.createElement("a");
            link.href = canvas.toDataURL("image/png", 1.0);
            link.download = "Eid_Card.png";
            link.click();
        }

        window.onload = () => {
            const firstDesign = document.querySelector('.design-option');
            if(firstDesign) selectDesign(firstDesign, firstDesign.src);
        };
    </script>
</body>
</html>
