<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة التهنئة</title>
    <style>
        @font-face {
            font-family: 'NotoKufiArabic';
            src: url('NotoKufiArabic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            font-family: 'NotoKufiArabic', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            text-align: center;
            overflow: hidden;
            padding: 10px;
        }

        .container {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 { font-size: 1.4rem; margin-bottom: 8px; color: #333; }
        h3 { font-size: 0.9rem; margin-bottom: 8px; color: #333; }

        .design-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .design-option {
            width: 70px;
            height: 100px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            object-fit: cover;
        }

        .design-option.active {
            border-color: #7BDECA;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(123, 222, 202, 0.5);
        }

        .preview {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .preview canvas {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .card-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-form input {
            margin-bottom: 10px;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            text-align: center;
            direction: rtl;
        }

        .card-form button {
            padding: 10px 25px;
            background: #e0e0e0;
            color: #000000;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            min-width: 150px;
            transition: all 0.3s ease;
        }

        .card-form button:hover {
            background: #a9a9a9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>بطاقة عيد الأضحى <br> Eid Al-Adha</h2>
        <h3>Select Card Design | اختر تصميم البطاقة</h3>
        
        <div class="design-selector" id="designSelector">
            <img src="https://images.ctfassets.net/jrh3lrn7oql1/514XAQipKfC5tojDBSOssg/b0e30a81e5e86138d1a865c30d48d985/Eid_Alhajj_2026_card_-01.jpg" 
                 class="design-option active" 
                 onclick="selectDesign(this, this.src, 150, '#1a365d', 'right')">
            
            <img src="https://images.ctfassets.net/jrh3lrn7oql1/5KQJReyJA5jXUsIroa1VEb/defce11fdbf15978427d9e32bb66581e/Eid_Alhajj_2026_card_-02.jpg" 
                 class="design-option" 
                 onclick="selectDesign(this, this.src, 150, '#1a365d', 'right')">
        </div>

        <div class="preview">
            <canvas id="previewCanvas"></canvas>
        </div>

        <div class="card-form">
            <input type="text" id="nameInput" placeholder="الاسم - المسمى الوظيفي | Name - Job Title" oninput="updatePreview()">
            <button onclick="generateCard()">Download | تحميل البطاقة</button>
        </div>
    </div>

    <script>
        let canvas = document.getElementById("previewCanvas");
        let ctx = canvas.getContext("2d");
        let image = new Image();
        image.crossOrigin = "Anonymous";

        let currentY = 130;
        let currentColor = "#1a365d";
        let currentAlign = "right";

        function selectDesign(element, src, yPos, color, align) {
            document.querySelectorAll('.design-option').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
            
            currentY = yPos;
            currentColor = color;
            currentAlign = align;
            
            image.src = src;
        }

        image.onload = function () {
            canvas.width = image.width;
            canvas.height = image.height;
            updatePreview();
        };

        function updatePreview() {
            let fullText = document.getElementById("nameInput").value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            // --- إعدادات الخط (تم تكبير الحجم بناءً على طلبك) ---
            let fontSize = 80; 
            let lineHeight = 100; 
            ctx.font = `bold ${fontSize}px 'NotoKufiArabic'`;
            ctx.fillStyle = currentColor;
            ctx.textAlign = "right";
            ctx.textBaseline = "bottom";

            // --- الإحداثيات المستخرجة من صورك المرفقة ---
            let marginRight = 180;   // المسافة من حافة اليمين لتجنب الأطراف
            let marginBottom = 450; // رفعه عن القاع ليكون فوق نص "إحدى شركات الصندوق"

            let lines = fullText.split("-");

            lines.forEach((line, index) => {
                // ترتيب الأسطر بحيث يكون الاسم في الأعلى والمسمى تحت
                let yOffset = (lines.length - 1 - index) * lineHeight;
                
                // إضافة وضوح عالي للنص
                ctx.shadowColor = "rgba(0, 0, 0, 0.1)";
                ctx.shadowBlur = 3;

                let xPos = canvas.width - marginRight;

                ctx.fillText(
                    line.trim(), 
                    xPos, 
                    canvas.height - marginBottom - yOffset
                );
            });
        }

        function generateCard() {
            let link = document.createElement("a");
            link.href = canvas.toDataURL("image/png", 1.0);
            link.download = "Eid_Card.png";
            link.click();
        }

        // تشغيل التصميم الأول تلقائياً عند فتح الصفحة
        window.onload = () => {
            const firstDesign = document.querySelector('.design-option');
            if (firstDesign) {
                selectDesign(firstDesign, firstDesign.src, 130, '#1a365d', 'right');
            }
        };
    </script>
</body>
</html>
