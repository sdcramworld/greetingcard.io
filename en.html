<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة التهنئة</title>
    <style>
        @font-face {
            font-family: 'NotoKufiArabic';
            src: url('NotoKufiArabic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            font-family: 'NotoKufiArabic', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            text-align: center;
            padding: 20px;
        }

        .container {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            background: white;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        /* --- تنسيق معرض الصور (التصاميم) --- */
        .design-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .design-option {
            width: 100px;
            height: 140px; /* تناسب شكل البطاقة الطولي */
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* تمييز الصورة المختارة */
        .design-option.active {
            border-color: #7BDECA;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
        }

        .preview canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }

        .card-form input {
            margin-bottom: 15px;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
            direction: rtl;
        }

      .card-form button {
            /* التنسيق الأساسي */
            padding: 10px 30px;      /* مسافات داخلية متوازنة */
            background: #e0e0e0;     /* لون رمادي فاتح */
            color: #000000;          /* نص باللون الأسود */
            border: 1px solid #ccc;  /* إطار بسيط لتعريف الحواف */
            border-radius: 8px;      /* زوايا منحنية */
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            
            /* تعديل الحجم والعرض */
            width: auto;             /* إلغاء العرض الكامل (100%) */
            min-width: 150px;        /* تحديد أقل عرض ممكن لضمان شكل مرتب */
            display: inline-block;   /* للسماح للزر بأخذ حجم محتواه فقط */
            
            transition: all 0.3s ease; /* تأثير ناعم عند الانتقال */
        }

        .card-form button:hover {
            background: #a9a9a9;     /* رمادي غامق عند مرور الماوس (Hover) */
            color: #000000;          /* الحفاظ على لون النص أسود */
            border-color: #888;      /* تغميق الإطار قليلاً عند الهوفر */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-bottom: 10px;">Select the card design | اختر تصميم البطاقة</h2>
        
        <div class="design-selector" id="designSelector">
            <img src="https://images.ctfassets.net/jrh3lrn7oql1/514XAQipKfC5tojDBSOssg/d36aca13ca3be5dd225def65f827a679/Eid_Al-Adha_2026_card_1.jpg" 
                 class="design-option active" 
                 onclick="selectDesign(this, this.src)" 
                 alt="Design 1">
            
            <img src="https://images.ctfassets.net/jrh3lrn7oql1/5KQJReyJA5jXUsIroa1VEb/461effb16220eaf1891f309dd7829aca/Eid_Al-Adha_2026_card_2.jpg" 
                 class="design-option" 
                 onclick="selectDesign(this, this.src)" 
                 alt="Design 2">
                 
            </div>

        <div class="preview">
            <canvas id="previewCanvas"></canvas>
        </div>

        <div class="card-form">
            <input type="text" id="nameInput" placeholder="ادخل اسمك | Enter your Name" oninput="updatePreview()">
            <button onclick="generateCard()">Download Card | تحميل البطاقة  </button>
        </div>
    </div>

    <script>
        let canvas = document.getElementById("previewCanvas");
        let ctx = canvas.getContext("2d");
        let image = new Image();
        image.crossOrigin = "Anonymous";

        // وظيفة اختيار التصميم
        function selectDesign(element, src) {
            // إزالة كلاس active من جميع الصور
            document.querySelectorAll('.design-option').forEach(img => img.classList.remove('active'));
            // إضافة الكلاس للصورة المحددة حالياً
            element.classList.add('active');
            
            // تغيير مصدر الصورة وتحديث اللوحة
            image.src = src;
        }

        image.onload = function () {
            canvas.width = image.width;
            canvas.height = image.height;
            updatePreview();
        };

        function updatePreview() {
            let nameText = document.getElementById("nameInput").value;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

            // إعدادات النص
            let fontSize = 65; 
            ctx.font = `bold ${fontSize}px 'NotoKufiArabic'`;
            ctx.fillStyle = "#000000";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // إضافة ظل للنص
            ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            ctx.shadowBlur = 5;
            
            // مكان النص (يمكنك تعديل الـ 180 حسب ارتفاع البطاقة الجديد)
            ctx.fillText(nameText, canvas.width / 2, canvas.height - 180);
        }

        function generateCard() {
            let link = document.createElement("a");
            link.href = canvas.toDataURL("image/png", 1.0);
            link.download = "Eid_Card.png";
            link.click();
        }

        // تشغيل التصميم الأول عند البدء
        window.onload = () => {
            const firstDesign = document.querySelector('.design-option');
            selectDesign(firstDesign, firstDesign.src);
        };
    </script>
</body>
</html>
